name: Build Android Kotlin APK

on:
  push:
    branches: [ main, master ] # Triggers automatically when you push code
  workflow_dispatch: # Allows you to manually click "Run" anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
